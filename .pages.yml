# Beheerscherm (Pages CMS) voor de website van Vai Avanti.
# Alles bewerk je het makkelijkst via /beheer op de site zelf (met voorbeeld); dit is de reserve.
# Dit bestand wordt deels gemaakt door _bron/tools/cms-config.js.

media:
  input: media
  output: /media
  extensions:
    - jpg
    - jpeg
    - png
    - webp
  rename: safe
content:
  - name: nieuws
    label: Wedstrijdverslagen
    type: collection
    path: inhoud/nieuws
    format: json
    filename: '{year}-{month}-{day}-{primary}.json'
    view:
      primary: titel
      fields:
        - titel
        - datum
      sort:
        - datum
        - titel
      default:
        sort: datum
        order: desc
    fields:
      - name: titel
        label: Titel
        type: string
        required: true
        description: Bijvoorbeeld de naam van de wedstrijd of de renbaan.
      - name: datum
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: Dag van de wedstrijd. Nieuwste verslagen staan bovenaan.
      - name: fotos
        label: Foto's
        type: image
        description: Voeg foto's toe van je gsm of computer. De eerste foto wordt de grote foto.
        options:
          multiple:
            max: 40
      - name: tekst
        label: Verslag
        type: rich-text
        description: De namen van de honden worden vanzelf herkend en gelinkt.
        options:
          format: markdown
          media: false
      - name: kop
        label: Kop voor de startpagina (mag leeg blijven)
        type: string
      - name: samenvatting
        label: Korte samenvatting voor de startpagina (mag leeg blijven)
        type: text
      - name: overzicht
        label: Dit is een seizoensoverzicht
        type: boolean
      - name: datumOnbekend
        type: boolean
        hidden: true
      - name: volgorde
        type: number
        hidden: true
  - name: honden
    label: Onze honden
    type: collection
    path: inhoud/honden
    format: json
    filename: '{primary}.json'
    view:
      primary: roepnaam
      fields:
        - roepnaam
        - naam
      sort:
        - volgorde
        - roepnaam
      default:
        sort: volgorde
        order: asc
    fields:
      - name: roepnaam
        label: Roepnaam
        type: string
        required: true
      - name: naam
        label: Officiële naam
        type: string
        required: true
        description: Zoals in de stamboom, bijvoorbeeld Vai Avanti Tiamo.
      - name: geslacht
        label: Geslacht
        type: select
        options:
          values:
            - Teef
            - Reu
      - name: status
        label: Label op de foto (mag leeg blijven)
        type: string
        description: Bijvoorbeeld Veteraan, Op rust of Jong talent.
      - name: geboren
        label: Geboren op
        type: date
        options:
          format: yyyy-MM-dd
      - name: kleur
        label: Kleur
        type: string
      - name: vader
        label: Vader
        type: string
      - name: moeder
        label: Moeder
        type: string
        description: Gebruik exact dezelfde officiële naam als op de site, dan wordt ze automatisch gelinkt.
      - name: hoogtepunt
        label: Grootste prestatie (kort)
        type: string
      - name: omslagfoto
        label: Hoofdfoto
        type: image
      - name: fotos
        label: Meer foto's
        type: image
        options:
          multiple:
            max: 30
      - name: gezondheid
        label: Gezondheidsresultaten
        type: string
        list: true
        description: Eén resultaat per regel, bijvoorbeeld Heupen Excellent / A1.
      - name: palmares
        label: Palmares
        type: object
        list: true
        description: De volgorde maakt niet uit; de site sorteert op jaar.
        fields:
          - name: jaar
            label: Jaar
            type: string
          - name: titel
            label: Titel
            type: string
          - name: plaats
            label: Plaats
            type: string
      - name: stamboom
        label: Link naar de stamboom (Breed Archive)
        type: string
      - name: andereNamen
        label: Andere namen in verslagen (mag leeg blijven)
        type: string
        list: true
        description: Roepnaam en officiële naam worden al herkend. Voeg hier enkel extra namen toe.
      - name: volgorde
        label: Plaats in de lijst
        type: number
        description: 1 staat eerst.
      - name: fotoFocus
        type: string
        hidden: true
      - name: tekst
        label: Over deze hond
        type: rich-text
        options:
          format: markdown
          media: false
