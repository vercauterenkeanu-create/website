# Bouwt de website na elke wijziging (ook vanuit Pages CMS) en zet ze online via GitHub Pages.
# Nieuwe of gewijzigde teksten worden eerst vertaald (Engels, Duits, Italiaans, Fins, Deens) met DeepL
# (geheim DEEPL_API_KEY, gratis tot 500.000 tekens per maand) of anders Claude (ANTHROPIC_API_KEY);
# de vertalingen komen in vertalingen/.
name: Website publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Bouwen en online zetten in één job: zo wacht de site niet op een tweede machine.
jobs:
  bouwen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Geïnstalleerde onderdelen van de vorige keer hergebruiken
        id: onderdelen
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}
      - if: steps.onderdelen.outputs.cache-hit != 'true'
        run: npm ci
      - name: Verkleinde foto's van de vorige keer hergebruiken
        uses: actions/cache@v4
        with:
          path: site/img
          key: fotos-${{ hashFiles('media/**') }}
          restore-keys: fotos-
      - name: Vertalen en bouwen
        run: npm run build
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY || secrets.DEEPL_API_KEYS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Nieuwe vertalingen bewaren
        continue-on-error: true
        run: |
          if [ -n "$(git status --porcelain vertalingen)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vertalingen
            git commit -m "Vertalingen bijgewerkt"
            git fetch --depth=50 origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
